<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Paragrafo</h1>
    <p><strong> e um parágrafo de texto de uma linha</strong></p>
    <p><em>texto em italico</em></p>
    <p>Minha casa tem 80m<sup>2</sup></p>
    <p>a composição da quimca H<sub>2</sub>O</p>
</body>
</html>
